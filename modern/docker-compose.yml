services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      HotelManager__DbPath: /data/hotelmanager.db
    volumes:
      - hotelmanager-data:/data
    restart: unless-stopped

volumes:
  hotelmanager-data:
