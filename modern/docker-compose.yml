services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: hotel
      POSTGRES_PASSWORD: hotel
      POSTGRES_DB: hotelmanager
    volumes:
      - hotelmanager-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel -d hotelmanager"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      HotelManager__DbProvider: Postgres
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=hotelmanager;Username=hotel;Password=hotel"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  hotelmanager-postgres:
